[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchdown-analyzer"
version = "1.3.0"
description = "Video-based landing accuracy measurement for glider spot-landing competitions"
readme = "README.md"
# 3.12+ because numpy 2.5 (used by the calibration solver) requires it.
# The capture side alone is stdlib-only and would still run on 3.10.
requires-python = ">=3.12"
authors = [{ name = "Intrinsic Engineering GmbH" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0"]

[project.scripts]
touchdown-analyzer = "touchdown_analyzer.cli:main"

[project.gui-scripts]
touchdown-analyzer-launcher = "touchdown_analyzer.launcher:main"

[project.optional-dependencies]
# The control UI. The recorder itself stays stdlib-only, so `record` keeps
# working even if this is not installed.
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
# Detection and measurement (`analyze`, and the landings page of the UI).
# 4.x pinned: 5.0 changed enough of the API to want a deliberate move.
analysis = ["opencv-python-headless>=4.12,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
touchdown_analyzer = ["control/static/*.html", "control/static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The survey calculator predates the line limit; not worth reflowing.
"tools/*" = ["E501"]
# Embedded shell/systemd templates: long lines are the scripts' own.
"packaging/debian/build_deb.py" = ["E501"]
# Embedded OOXML templates: the long lines are the schema URIs.
"src/touchdown_analyzer/store/ranking.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["touchdown_analyzer"]
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true
